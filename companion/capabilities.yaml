      `<Doing stuff in crafting_table container: [[wooden_sword]]>` → **25 秒后背包 0 → 1**。
      ⚠️ 同一天早先用 `@get wooden_sword` 失败（`MOVEMISMATCH holding=oak_planks want=stick`）——
      那次是命令链的手持切换问题；直接 runUserTask(ResourceTask) 走的是"到工作台合成"的正路。
  - id: player_inventory
    wave: W9
