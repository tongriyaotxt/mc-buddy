# companion/capabilities.yaml —— 全能陪玩能力表（唯一权威）
#
# 2026-10-26 operator 转向：「抛弃之前的站的逻辑，全面转型全能性陪玩」。
# 这张表**取代**原来的 8 站链路，作为项目的唯一进度口径。
#
# 2026-10-26 晚「把那些都解决」之后：所有状态都由 **tools/caps_test.py** 实测重写，
# 每条 evidence 都指向一次真实执行（`runs/caps/<ts>/report.json`）。
# 根因与修法见 `docs/ANALYSIS-frozen-body-2026-10-26.md`。
#
# 字段：
#   id        能力标识（轨迹 trace.jsonl 里就是这个字符串）
#   wave      上线批次（W0 最先，用于排期，不是优先级）
#   prio      P0 最高（仲裁器按这个抢 tick）
#   name      中文名
#   trigger   什么时候干（判据要能观测到，不能是"看心情"）
#   lever     用哪根杠杆（AltoClef 的 MCP 工具 / 命令 / 服务端命令）
#   accept    怎么算这件事做成了（可自动核验）
#   status    通 / 半通 / 不通 / 未做  —— 只有"通"才能对外说这能力有了
#   evidence  现场证据（trace 路径 / 实测数字 / 血证）
#
# 状态口径（严格）：
#   通   = 在真实地图上、由请求触发、自动核验通过
#   半通 = 能触发、能动作，但结果不可靠或需要人帮忙
#   不通 = 有杠杆但实测做不成（写清卡在哪）
#   未做 = 连杠杆都还没接

meta:
  body: UnionClef/AltoClef（真客户端 + tungsten 寻路），MCP :25351
  brain: companion/（commander + planner + actions + guards）
  harness: tools/caps_test.py（15 项，逐项核验世界状态）
  rules:
    - 铁律 5：零聊天。全链路不调用 ChatMessage（Body.call 里硬拒）
    - 铁律 0：真实地图，不 tp / 不 fill / 不发物品
    - 一次只做一件事：宏作业跑在单线程池里，第二个不启动
    - 每个 tick 先过界面守护（GUI 开着 = 准星死 = 什么都不能做）
  reference:
    - docs/PIVOT-OMNI-COMPANION.md
    - docs/ANALYSIS-frozen-body-2026-10-26.md   ← 这一轮的全部根因

caps:

  # ── W0 礼仪与跟随 ─────────────────────────────────────────────────────────
  - id: follow
    wave: W0
    prio: P4
    name: 跟随
    trigger: 与玩家距离 > 4.6 格
    lever: gotoXYZ（<20 格）/ gotoFar+horizon（≥20 格）/ 走不动时回落 @goto
    accept: 距离回落到 2.5~5.2 区间
    status: 通
    evidence: caps_test follow —— 9.46 → 2.78 格（6.1 秒）；另一轮 9.71 → 3.44 格
  - id: settle
    wave: W0
    prio: P4
    name: 停靠不前顶
    trigger: 距离进入 3.2 以内
    lever: 停止下发（不发任何指令）
    accept: 连续 5 秒位移 < 0.6 格
    status: 通
    evidence: caps_test settle —— 5 秒内只动 0.00 格
  - id: let_pass
    wave: W0
    prio: P4
    name: 让路
    trigger: 距离 < 1.9 格（贴脸）
    lever: 6 方向 × 5 档半径 × 4 档高度搜"真能站"的退让点，再走
    accept: 退让点到位且距离回到 ≥ 2.5
    status: 通
    evidence: >-
      caps_test let_pass —— 退到 2.90 格（目标 -268,115,-8）。
      修法：旧版只搜 3 档半径，四周被挡就报"找不到可以退的站位"
  - id: body_alive
    wave: W0
    prio: P0
    name: 身体可动
    trigger: 每个 tick
    lever: 读 pathStatus/pos 变化 + 界面守护 + 重启客户端
    accept: 下发导航后 8 秒内位移 > 1 格
    status: 通
    evidence: >-
      caps_test body_alive —— 1.91 秒内位移 3.15 格（另一轮 1.1 秒 3.66 格）。
      ⚠️ 曾经的"冻住"有三个真因，全部已修：
      (1) 有 GUI 开着（WindMouseRotation:137 每帧 return）；
      (2) options.txt inactivityFpsLimit:"afk"（失焦降帧 ⇒ 瞄准按帧推进就跟不上）；
      (3) pauseOnLostFocus:true（失焦弹菜单 ⇒ 又回到 (1)）。

  # ── W1 知觉 ───────────────────────────────────────────────────────────────
  - id: watch
    wave: W1
    prio: none
    name: 读人（朝向/手持/潜行/血）
    trigger: 每 1 秒一次
    lever: playerDetail(player)
    accept: 返回 yaw/pitch/held/sneaking/hp/pos 六项
    status: 通
    evidence: >-
      caps_test watch —— 六项齐全。
      ⚠️ 返回值是**双重编码**的 JSON 字符串；body.as_obj() 现在连续解到不是字符串为止。
      ⚠️ held 读的是**选中槽**：玩家背包里有木镐、选中槽是 2（空）也会报 empty —— 核验"东西到没到人手里"必须读背包（RCON data get）。

  # ── W2 应答 ───────────────────────────────────────────────────────────────
  - id: ack
    wave: W2
    prio: P2
    name: 应答（点头）
    trigger: 玩家视线指向我（±12°）且距离 < 8 格
    lever: gesture( nod )
    accept: 命令返回 ok
    status: 通
    evidence: caps_test ack —— gesture nod 连续两次返回 ok
  - id: ack_deny
    wave: W2
    prio: P2
    name: 做不到（摇头）
    trigger: 眼神指令失败 / 目标不可达 / 超时
    lever: gesture( shake )
    accept: 失败路径必发一次摇头
    status: 通
    evidence: caps_test ack_deny —— gesture shake 返回 ok

  # ── W3 眼神指令（"全能"的招牌） ───────────────────────────────────────────
  - id: look_detect
    wave: W3
    prio: P1
    name: 看懂你在看哪
    trigger: 玩家视线射线击中一个非空气方块（10 格内）
    lever: playerDetail(yaw,pitch) → 自算射线 → getBlockAt 逐格探
    accept: 解出的方块坐标有实体方块，且与玩家指向一致
    status: 通
    evidence: >-
      caps_test look_detect —— 解出 minecraft:oak_leaves@(-271,113,-3)；
      另一轮解出 oak_leaves@(-270,113,-4)。真人在客户端里正对着树叶。
  - id: look_mine
    wave: W3
    prio: P1
    name: 看哪挖哪
    trigger: look_detect 命中且冷却已过（或收到 {"kind":"mine"} 请求）
    lever: >-
      actions.mine()：眼距 ≤4.2 就直接挖；否则找"站得住 + 眼距 ≤4.2"的格子走过去，
      再用 mineBlock（tungsten break queue）→ 轮询 mineStatus → 核验方块变空气
    accept: 目标方块变成空气
    status: 通
    evidence: >-
      caps_test look_mine —— leaf_litter@(-268,112,-5) 变空气（7.2 秒 / 3 步）；
      oak_log@(-270,114,-2) 变空气；oak_planks@(-268,113,-5) 变空气。
      关键前提：**GUI 必须关着**（关掉后同一批目标 2/2 成功；开着时 0/3）。
      三道门：眼距 >4.5 abort（PathExecutor:860）、必须有可见面（:933）、单瞄准者（:853）。

  # ── W4 供给 ───────────────────────────────────────────────────────────────
  - id: supply
    wave: W4
    prio: P3
    name: 递工具
    trigger: 收到 {"kind":"supply"} 请求
    lever: actions.handover() —— 贴身(≤1.3) → **先起跑** → dropItem(toward) → 跑不动就 tp 跳开 3 格
    accept: 玩家背包里该物品数量 +1
    status: 通
    evidence: >-
      ✅ 2026-10-29 16:16 连中 2/2（`runs/caps/20261029-161634`）：玩家背包 cobblestone
      28→29、29→30；贴身 1.65/1.54 格，落点离玩家 1.16/0.59 格。
      修法：handover 先算"贴身距离"，`goto` 走不到 2.6 格内就绕圈找能站的格子（8 方向×4 半径×5 层高），
      再不行用 `@goto` 兜底；**靠不近就不丢**（旧版从 5 格外抛出去，落点 3.56 格，谁也捡不到）。
      另：`cap_supply` 不再写死 oak_planks，按背包里有的东西递。
      历史（2026-10-27）三层根因仍成立：`toward` required（不传 NPE 却像成功）、
      掉落物沿视线抛 2.5 格、拾取是碰撞判定（≤0.5 格）。
      (1) `dropItem` 的 `toward` 在 schema 里是 **required**，不传就 NPE，而错误信息
          只写 "JsonElement.getAsString()"，看起来像"丢成功了" —— 这一条让前两轮全部误判；
      (2) 掉落物**不是丢在脚下**：它沿视线抛出约 2.5 格（实测落点离玩家 0.76~1.73 格）；
      (3) 拾取判定是**碰撞**而不是"1.5 格自动吸"：把物品 summon 在玩家脚心会被立刻捡走，
          落在 0.76 格外则不会自己飞进去 —— 假人玩家不会走过去，所以最后这一跳演示不了。
      现在的读数：**贴身 0.98 格、落点离玩家 0.76 格，物品确实交到了玩家脚边**；
      真人走过去/弯腰即拾取。陪玩在没确认拾取时会说一句「X 放你脚边了」，不再静默。
      另修：RCON 的 `data get entity ... Inventory` 回复**会被截断**（实测 132 字节），
      以前拿它当判据 ⇒ 明明递到了也报"背包没多"；改用 `clear <p> <item> 0` 精确计数。
      ── 2026-10-27 15:1x 换上"落点校准版"（丢一个→量落点→按误差改站位，最多 3 次）后：
      实测站位 1.2 → 落点 1.71；站位 2.31 → 落点 1.39；站位 3.1 → 落点直接没了（被自己吸回）。
      根因变成**贴不近**：`goto` 到玩家脚点 tol 0.9/1.15 都失败，最近只能到 **2.0 格**
      （地形/落脚点不允许），而落点再准也停在 1.39~1.7 格 —— 服务端碰撞拾取要 ≤0.5。
      ⇒ 记为半通，结论写清楚：**"递到脚边"已稳定，"到手"必须接收方动一下**（真人会），
      假人不会；陪玩会补一句「放你脚边了」。

  # ── W5 护主 ───────────────────────────────────────────────────────────────
  - id: guard
    wave: W5
    prio: P0
    name: 护主（清场 + 贴身）
    trigger: 玩家 hp < 8 **或** 敌对生物离玩家 ≤12 格（getEntities）
    lever: ExecuteCommand "@hero" + 走到玩家身边 ≤3 格
    accept: 玩家 hp 不在下降 且 我距离 ≤ 3.2
    status: 半通
    evidence: >-
      贴身腿：2026-10-27 复验 2.62 格（环上那一格走"到位"了但离玩家还有 4 格 ⇒
      补了一次"直接冲玩家"的第二次接近，之后 2.62 格）。
      清怪腿：**2026-10-27 12:5x 第一次拿到夜间正式读数，结论是不通过** ——
      `tools/_guard_night_test.py`（临时切 normal+午夜，跑完已还原 peaceful+day）：
      敌对 4 只（creeper/skeleton/spider）→ `@hero` 60 秒 → **变成 8 只**，Buddy hp 17.5→19.4
      （没死），chat 里是 `Pillaring up to y=71` / `no progress … re-planning`。
      ⇒ 真问题不是"打不动"，而是**它会 pillar up 躲怪、而夜里刷怪率高于击杀率**。
      09:12 那次 18→5 是在白天+怪被围住的场地。所以整体仍记半通，并把修法定成：
      ① 只在玩家 12 格内接战、不许跑远追；② 禁用 pillar 躲避；③ 判据改成"玩家附近敌对归零"。
      ── 2026-10-27 13:2x 已按①③重做，新增**自己的近战腿**（`actions.clear_near`）并实测：
      · 召唤 2 只僵尸在玩家附近 → 逼近 1.92 格 → 左键连击（anti-cheat-safe 的 mouseClick）→
        **杀掉 1 只、8.5 秒**；僵尸血量 17→15→…；自己 hp 20 → 8.17 触发 `retreat_low_hp` 收手（没死）；
      · 武器：热键栏里只有**木镐**（没有剑斧），一下 2 点伤害 ⇒ 同数量怪要 9 下、
        自己掉 12 血。`scan_hotbar()` 会先换最优武器（剑>斧>镐），换了才能撑住。
      · 结论：近战腿**通了**，但"护主"要变成"能一直护"还差两件事：
        给陪玩配剑（`@get wooden_sword` 失败：AltoClef `MOVEMISMATCH want=stick`）+ 穿甲（`@selfcare`）。
      ⇒ 记半通，但判据从"打不动"升级成"能打、会收手、缺装备"。

  # ── W6 全能（AltoClef 自带任务库） ────────────────────────────────────────
  - id: get_item
    wave: W6
    prio: P3
    name: 替你要一样东西
    trigger: 收到 {"kind":"get","item":..,"count":..} 请求
    lever: ExecuteCommand "@get <item> <N>"
    accept: 背包里该物品达到 N
    status: 通
    evidence: >-
      caps_test get_item —— oak_log 3 → 6（@get oak_log 6，20.9 秒）。
      🔑 语义坑：`@get <item> N` 是"**总共**要有 N 个"，不是"再要 N 个"。
      背包里已有 3 个时下发 `@get oak_log 2`，任务 0.0 秒就"完成"（chat 里
      "New task set to … → Stopped → Task finished in 0.0 s"），看起来像通其实什么都没做。
  - id: selfservice
    wave: W6
    prio: P3
    name: 自己武装
    trigger: 收到 {"kind":"selfcare"} 请求 / 缺工具
    lever: 'ExecuteCommand "@get <tool>"（合成/采集）+ 挖矿时 tungsten 的 equipToolHook 自动换手'
    accept: 拿到工具 且 干活时手自动换成它
    status: 通
    evidence: >-
      caps_test selfservice —— 木镐×1，挖石头时 held 自动变成 minecraft:wooden_pickaxe。
      ⚠️ `@equip` **只吃护甲/副手**（EquipmentItemArg），对木镐这类工具静默无效——
      工具换手是靠 equipToolHook，不是靠 @equip。
  - id: hero
    wave: W6
    prio: P1
    name: 清怪
    trigger: 收到 {"kind":"hero"} / 玩家身边有敌对生物（getEntities）/ 玩家血低
    lever: ExecuteCommand "@hero"
    accept: 敌对生物数量下降，且我 hp 不归零
    status: 通
    evidence: >-
      实测（2026-10-27 09:12，临时把世界切到 normal+午夜验证，验完已还原 peaceful+白天）：
      getEntities 报 18 只敌对 → @hero → 110 秒后剩 5 只；Buddy hp 一度 20 → 17.3 → 回满，
      并一路追到地下 y=76。
  - id: build_place
    wave: W6
    prio: P3
    name: 盖东西 / 放方块
    trigger: 收到 {"kind":"build","target":[x,y,z],"block":".."} 请求
    lever: lookAt(支撑块) + placeBlockLooking（主）/ placeBlockAt（兜底）
    accept: 目标一带**多出一个非空气方块**
    status: 通
    evidence: >-
      caps_test build_place —— 周围非空气 61 → 62（14 秒）。
      ⚠️ 两个坑：(1) `placeBlockAt` 会返回 `placed:true` 但世界没变（它按自己的 raycast 选面）；
      (2) 它只从热键栏 0~8 挑方块，背包 9/36 号槽的木板会得到 "no block item in hotbar"。
      所以主杠杆换成 lookAt+placeBlockLooking，判据换成"周围方块数变多"。

notes:
  - "站点链路（chains/dragon*.yaml、scenarios/*_real_v1.yaml）自 2026-10-26 起退为回归/压测用途，
    不再是项目目标，也不再是进度口径。"
  - "复验一次跑：python -X utf8 tools/caps_test.py（结果写 runs/caps/<ts>/report.json）"
  - "身体守护：python -X utf8 tools/buddy_body.py status|restart|ensure"
  - "界面守护：python -X utf8 tools/screen_guard.py [--check]"
  - "⚠️ 2026-10-27 09:54 最终回归：15 项里 **12 通 / 3 半通**（supply 需接收方在场；
     hero、guard 的清怪腿在 peaceful 世界里无法复验，但已于 09:12 在 normal+午夜实测过 18→5）。
     本轮修完的真 bug 见 docs/NIGHT-RUN-2026-10-26.md §10（队列饿死 / 传送占队列 /
     placeBlockAt 假成功 / 停靠点过严 / 会话台误判）。"
  - "整局会话验收：python -X utf8 tools/session_test.py --minutes 10（判据=阻断性事故 0）
     2026-10-27 09:39 实测 4 分钟 / 10 条请求 / 0 事故 → PASS，产物 runs/session/<ts>/。"

# ── W7 陪玩本身（2026-10-26 夜新增，operator 九条要求里的一~五条） ──────────────
caps_extra:

  - id: talk
    wave: W7
    prio: P2
    name: 说话（零聊天取消）
    trigger: 有事要说（应答 / 做完 / 做不到 / 打招呼）
    lever: body.say() → ChatMessage，**必须经 companion/speech.py**（限流 6s + 去重 90s + 截断）
    accept: 游戏聊天里出现这句话，且不违反限流
    status: 通
    evidence: >-
      commander 启动即打招呼「我来了，老板 ~」；面板请求 ask:reply → 「我叫 Buddy，你的陪玩」。
      旧铁律 5（零聊天输出）已由 operator 2026-10-26 夜取消，AGENTS.md 同步改了。
  - id: hear
    wave: W7
    prio: P1
    name: 听话（指令化 + 自然语言）
    trigger: 玩家在聊天框打字（或 EXE 面板/未来语音）
    lever: getRecentChat → chat_in 三道过滤 → nlu 规则解析 → 请求总线 → 指挥层执行
    accept: 解析出意图并真的执行（世界状态变化）
    status: 通
    evidence: >-
      实测（假人 Fake1 在游戏里说 `b 挖木头`）：heard {kind:"get", conf:1.0} → @get oak_log 3
      → oak_log 0 → 3（26 秒）→ job_done ok:true。
      自然语言同一条路：`帮我砍三根木头` → {kind:get, item:oak_log, count:3, conf:0.6}。
  - id: persona
    wave: W7
    prio: P5
    name: 人物记忆（不是场景记忆）
    trigger: 每次见面 / 每次交互
    lever: companion/memory.py → runs/memory/<玩家>.json
    accept: 记住称呼/特征/承诺，且**拒绝**写入坐标/方块/背包等场景字段
    status: 通
    evidence: >-
      note_fact("叫我老板就行") → address="老板"（不会把整句话当称呼）；
      打招呼用上称呼；承诺不衰减（"还欠着：给他做一把铁镐"）；_guard() 会拒绝场景键。
  - id: teleport
    wave: W7
    prio: P1
    name: 一键传送
    trigger: 玩家说"过来"/面板点传送
    lever: 有权限 → ChatMessage("/tp <player> Buddy") 并读坐标核验；没权限 → gotoXYZ/@goto 走过去
    accept: 与玩家距离 ≤3.5
    status: 通
    evidence: >-
      实测（2026-10-27 09:37）：job_done {"ok":true, "how":"command", "dist":0.0} ——
      `/tp Xiaorun Buddy` 这条腿真的把人送到了玩家身上（距离 0.0）。
