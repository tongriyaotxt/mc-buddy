    status: 通
    evidence: >-
      实测（2026-10-27 22:2x，先把箱子界面开起来）：`move_item(28 -> 9)` 之前 28 号槽是
      `minecraft:stick`、9 号空；两下 PICKUP 之后 **28 空、9 是 stick** ⇒ 真挪动。
