    evidence: >-
      jar 换成 `unionclef-...-buddy6.jar` 后实测（2026-10-27 22:07）：
      `listCommands()` 回 **59 条**内建命令（我们以前手抄的只有 40 条，漏了 give/pearl/shoot/
      sign/shift/dummy/check_player/agent…）；`obtainableItems()` 回 **683 种可获取资源**；
      `hook.available()` True；`takeControl(true)` 能一键停掉它自己的任务链（实测把一条
      跑偏的 PickupFromContainerTask 停掉，userTask 立刻变空）。
